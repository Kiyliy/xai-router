# gitleaks configuration: the default rules, plus an allow-list for the
# obviously fake key strings used as fixtures in unit tests.
[extend]
useDefault = true

[allowlist]
description = "Fake xAI keys used as test fixtures"
regexes = [
  '''xai-abc123def456''',
  '''xai-second-key-0002''',
]
# UI string dictionaries: keys such as 'lg5.tokReasoningNone' look like
# generic API keys to the entropy rule. They hold no secrets.
paths = [
  '''web/static/js/i18n[-a-z]*\.js''',
]
