services:
  xai-router:
    image: ghcr.io/kiyliy/xai-router:latest
    # To build from source instead: comment out "image" and uncomment "build".
    # build: .
    restart: unless-stopped
    ports:
      - "${XR_PORT:-8080}:8080"
    environment:
      # Optional. If unset, a random password is generated on first start and
      # printed in the logs: docker compose logs xai-router
      XR_ADMIN_PASSWORD: ${XR_ADMIN_PASSWORD:-}
      XR_LOG_LEVEL: ${XR_LOG_LEVEL:-info}
      XR_LOG_FORMAT: ${XR_LOG_FORMAT:-json}
    volumes:
      # A named volume keeps the non-root container user's permissions.
      - xai-router-data:/data

volumes:
  xai-router-data:
