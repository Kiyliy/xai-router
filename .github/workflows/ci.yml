name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: openapi.yaml is valid YAML
        run: python3 -c "import yaml,sys; yaml.safe_load(open('web/static/openapi.yaml')); print('ok')"
      - name: console JS parses (ES modules)
        run: |
          fail=0
          for f in $(git ls-files 'web/static/*.js' 'web/static/**/*.js'); do
            node --input-type=module --check < "$f" || { echo "::error file=$f::syntax error"; fail=1; }
          done
          exit $fail
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: test
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: coverage
        run: |
          go tool cover -func=coverage.out | tail -1
          go test -count=1 -coverpkg=./internal/... -coverprofile=all.out ./... > /dev/null
          echo "total (all tests, internal packages):"
          go tool cover -func=all.out | tail -1
      - name: build
        run: CGO_ENABLED=0 go build -trimpath -o xai-router ./cmd/xai-router && ./xai-router version
      - name: console smoke test (headless Chrome, every page, no console errors)
        run: |
          mkdir -p /tmp/xr-smoke
          XR_DATA_DIR=/tmp/xr-smoke XR_LISTEN=127.0.0.1:18080 XR_ADMIN_PASSWORD=ci-smoke-password ./xai-router > /tmp/xr-smoke.log 2>&1 &
          for i in $(seq 1 30); do curl -sf 127.0.0.1:18080/healthz > /dev/null && break; sleep 1; done
          flag=""; [ "$(node -p 'process.versions.node.split(".")[0]')" -lt 22 ] && flag=--experimental-websocket
          node $flag tools/smoke/smoke.mjs --base http://127.0.0.1:18080 --password ci-smoke-password || { tail -50 /tmp/xr-smoke.log; exit 1; }

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --no-banner --redact -v .

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: xai-router:ci
